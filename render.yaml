services:
  - type: web
    name: auction-marketplace
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auction-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1

  - type: worker
    name: auction-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app/worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auction-db
          property: connectionString

databases:
  - name: auction-db
    databaseName: auction_marketplace
    user: auction_user
    plan: free
